name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  macos:
    name: Build and publish the Mac app (Apple Silicon)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: target/fooddb
          key: usda-${{ hashFiles('scripts/build-fooddb.sh') }}
      - name: Build the food database (USDA FoodData Central, public domain)
        run: npm run build:fooddb
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          # Signs the update bundle so installed apps only accept builds made here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target aarch64-apple-darwin
          tagName: v__VERSION__
          releaseName: Private-I v__VERSION__
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          releaseBody: |
            Private-I for Macs with Apple Silicon (M1 or newer).

            **Install**
            1. Download `Private-I_<version>_aarch64.dmg` below and open it.
            2. Drag **Private-I** into **Applications**.
            3. The app is ad-hoc signed, not notarised, so run this once in Terminal:

               ```
               xattr -dr com.apple.quarantine /Applications/Private-I.app
               ```
            4. Open Private-I from Applications.

            From v0.4.0 on, Private-I checks for updates itself and installs them when you say so.

            Your data stays on your Mac (in `~/Library/Application Support/app.privatei.desktop`).

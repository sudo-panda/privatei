[workspace]
resolver = "2"
members = ["crates/privatei-core", "apps/desktop"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "UNLICENSED"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"

# Build scripts and proc macros run on the host; stripping their dylibs breaks them on macOS.
[profile.release.build-override]
strip = false
debug = false

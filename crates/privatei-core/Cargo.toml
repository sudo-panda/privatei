[package]
name = "privatei-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private-I core: data, storage, calculations and AI calls. No UI."

[features]
default = []
# Run the user's installed Claude Code CLI. Desktop only.
cli = []
# Import national food databases (USDA CSV, Swiss xlsx).
import = ["dep:calamine", "dep:csv"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
calamine = { version = "0.38", optional = true }
csv = { version = "1.4", optional = true }

[[bin]]
name = "build-fooddb"
path = "src/bin/build_fooddb.rs"
required-features = ["import"]

[dev-dependencies]

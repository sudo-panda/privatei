[package]
name = "privatei-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private-I for macOS: thin Tauri commands over privatei-core"

[[bin]]
name = "privatei"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
privatei-core = { path = "../../crates/privatei-core", features = ["cli"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
